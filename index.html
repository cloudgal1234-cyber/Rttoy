<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#075e54">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>רטטוי 🐀</title>
<style>
  :root {
    --header: #075e54;
    --bg: #ece5dd;
    --me: #dcf8c6;
    --them: #ffffff;
    --text: #111b21;
    --muted: #667781;
    --input-bg: #f0f0f0;
    --field: #ffffff;
    --accent: #00a884;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --header: #202c33;
      --bg: #0b141a;
      --me: #005c4b;
      --them: #202c33;
      --text: #e9edef;
      --muted: #8696a0;
      --input-bg: #202c33;
      --field: #2a3942;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }
  header {
    background: var(--header);
    color: #fff;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    padding-top: max(10px, env(safe-area-inset-top));
    flex-shrink: 0;
    user-select: none;
    -webkit-user-select: none;
  }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: #f4e9d8;
    display: grid; place-items: center;
    flex-shrink: 0;
    overflow: hidden;
    cursor: default;
  }
  .avatar svg { width: 38px; height: 38px; }
  .who { display: flex; flex-direction: column; line-height: 1.2; }
  .who .name { font-weight: 600; font-size: 17px; }
  .who .status { font-size: 13px; opacity: .85; }
  .actions { margin-inline-start: auto; display: flex; gap: 4px; }
  #swap, #refresh {
    width: 40px; height: 40px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: #fff;
    display: grid; place-items: center;
    cursor: pointer;
    transition: transform .25s ease;
  }
  #swap:active, #refresh:active { background: rgba(255,255,255,.15); }
  #swap svg, #refresh svg { width: 24px; height: 24px; }
  #refresh.spin { animation: spin .5s ease; }
  @keyframes spin { to { transform: rotate(-360deg); } }
  body.as-remy #swap { transform: rotate(180deg); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    background-image: radial-gradient(rgba(0,0,0,.035) 1px, transparent 1px);
    background-size: 18px 18px;
  }
  .day {
    align-self: center;
    background: var(--them);
    color: var(--muted);
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 8px;
    margin: 8px 0;
    box-shadow: 0 1px 0.5px rgba(0,0,0,.13);
  }
  .msg {
    max-width: 80%;
    padding: 6px 9px 8px;
    border-radius: 8px;
    font-size: 15.5px;
    line-height: 1.35;
    word-wrap: break-word;
    white-space: pre-wrap;
    box-shadow: 0 1px 0.5px rgba(0,0,0,.13);
    position: relative;
    animation: pop .15s ease-out;
    user-select: none;
    -webkit-user-select: none;
  }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
  /* RTL: "me" on the right (start), Remy on the left (end) */
  .msg.me   { align-self: flex-start; background: var(--me);   border-top-right-radius: 0; }
  .msg.remy { align-self: flex-end;   background: var(--them); border-top-left-radius: 0; }
  .msg.cont.me   { border-top-right-radius: 8px; }
  .msg.cont.remy { border-top-left-radius: 8px; }
  .msg:not(.cont) { margin-top: 6px; }
  .meta {
    float: left;
    font-size: 11px;
    color: var(--muted);
    margin: 6px 10px -4px 0;
    direction: ltr;
  }
  .ticks { color: #53bdeb; margin-left: 3px; }
  .msg.deleting { opacity: .4; }

  footer {
    background: var(--input-bg);
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 8px;
    padding-bottom: max(8px, env(safe-area-inset-bottom));
    flex-shrink: 0;
  }
  #text {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    border-radius: 22px;
    padding: 11px 16px;
    font: inherit;
    font-size: 16px;
    background: var(--field);
    color: var(--text);
    max-height: 120px;
    line-height: 1.35;
  }
  #send {
    width: 46px; height: 46px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    display: grid; place-items: center;
    cursor: pointer;
    flex-shrink: 0;
    position: relative;
  }
  #send svg { width: 22px; height: 22px; transform: scaleX(-1); }
  /* The only (very subtle) mode cue: a tiny dot on the send button */
  #send::after {
    content: "";
    position: absolute;
    bottom: 5px; left: 50%;
    width: 3px; height: 3px;
    margin-left: -1.5px;
    border-radius: 50%;
    background: transparent;
  }
  body.as-remy #send::after { background: rgba(255,255,255,.55); }
</style>
</head>
<body>
  <header>
    <div class="avatar" id="avatar" aria-hidden="true">
      <!-- Ratatouille: grey rat with a chef hat -->
      <svg viewBox="0 0 64 64">
        <ellipse cx="17" cy="34" rx="8" ry="9" fill="#8a8f98"/>
        <ellipse cx="17" cy="34" rx="4.5" ry="5.5" fill="#e8a7b0"/>
        <ellipse cx="47" cy="34" rx="8" ry="9" fill="#8a8f98"/>
        <ellipse cx="47" cy="34" rx="4.5" ry="5.5" fill="#e8a7b0"/>
        <ellipse cx="32" cy="42" rx="14" ry="13" fill="#9aa0a8"/>
        <ellipse cx="32" cy="50" rx="7" ry="5" fill="#c9ccd1"/>
        <circle cx="26" cy="40" r="2.6" fill="#222"/>
        <circle cx="38" cy="40" r="2.6" fill="#222"/>
        <circle cx="26.8" cy="39.2" r=".8" fill="#fff"/>
        <circle cx="38.8" cy="39.2" r=".8" fill="#fff"/>
        <ellipse cx="32" cy="47" rx="2.6" ry="2" fill="#d77a8a"/>
        <path d="M24 49 L14 47 M24 50.5 L14 51.5 M40 49 L50 47 M40 50.5 L50 51.5" stroke="#555" stroke-width=".8"/>
        <rect x="22" y="22" width="20" height="8" rx="1.5" fill="#fff" stroke="#ddd"/>
        <circle cx="25" cy="16" r="6" fill="#fff" stroke="#ddd"/>
        <circle cx="32" cy="12" r="7" fill="#fff" stroke="#ddd"/>
        <circle cx="39" cy="16" r="6" fill="#fff" stroke="#ddd"/>
        <rect x="21" y="16" width="22" height="9" fill="#fff"/>
      </svg>
    </div>
    <div class="who">
      <span class="name">רטטוי 🧀</span>
      <span class="status" id="status">מחובר</span>
    </div>
    <div class="actions">
    <button id="refresh" aria-label="רענן שיחה">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
    </button>
    <button id="swap" aria-label="החלף משתמש">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>
    </button>
    </div>
  </header>

  <main id="chat"></main>

  <footer>
    <textarea id="text" rows="1" placeholder="הודעה"></textarea>
    <button id="send" aria-label="שלח">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </footer>

<script>
(() => {
  const KEY = 'remy-chat-v1';
  const chat = document.getElementById('chat');
  const text = document.getElementById('text');
  const send = document.getElementById('send');
  const avatar = document.getElementById('avatar');
  const status = document.getElementById('status');

  let state = { asRemy: false, messages: [] };
  try {
    const saved = JSON.parse(localStorage.getItem(KEY));
    if (saved && Array.isArray(saved.messages)) state = saved;
  } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

  function greet() {
    state.messages.push({ id: Date.now(), from: 'remy', text: 'בונז\'ור! 🐀👨‍🍳\nכל אחד יכול לבשל!', t: Date.now() });
    save();
  }
  if (!state.messages.length) greet();

  const fmtTime = t => new Date(t).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
  const fmtDay = t => {
    const d = new Date(t), now = new Date();
    if (d.toDateString() === now.toDateString()) return 'היום';
    const y = new Date(now); y.setDate(now.getDate() - 1);
    if (d.toDateString() === y.toDateString()) return 'אתמול';
    return d.toLocaleDateString('he-IL');
  };

  function render() {
    chat.innerHTML = '';
    let prev = null;
    for (const m of state.messages) {
      if (!prev || new Date(prev.t).toDateString() !== new Date(m.t).toDateString()) {
        const day = document.createElement('div');
        day.className = 'day';
        day.textContent = fmtDay(m.t);
        chat.appendChild(day);
        prev = null;
      }
      const el = document.createElement('div');
      el.className = 'msg ' + m.from + (prev && prev.from === m.from ? ' cont' : '');
      el.dataset.id = m.id;
      el.append(document.createTextNode(m.text));
      const meta = document.createElement('span');
      meta.className = 'meta';
      meta.textContent = fmtTime(m.t);
      if (m.from === 'me') {
        const ticks = document.createElement('span');
        ticks.className = 'ticks';
        ticks.textContent = '✓✓';
        meta.appendChild(ticks);
      }
      el.appendChild(meta);
      attachLongPress(el, m.id);
      chat.appendChild(el);
      prev = m;
    }
    chat.scrollTop = chat.scrollHeight;
  }

  function applyMode() {
    document.body.classList.toggle('as-remy', state.asRemy);
  }

  function toggleMode() {
    state.asRemy = !state.asRemy;
    save();
    applyMode();
    if (navigator.vibrate) navigator.vibrate(30);
  }

  // Arrow button in the header switches who is writing.
  document.getElementById('swap').addEventListener('click', () => {
    toggleMode();
    text.focus();
  });

  // Refresh button: start the conversation over.
  const refresh = document.getElementById('refresh');
  refresh.addEventListener('click', () => {
    if (!confirm('להתחיל שיחה חדשה? כל ההודעות יימחקו')) return;
    clearTimeout(typingTimer);
    status.textContent = 'מחובר';
    state.messages = [];
    greet();
    render();
    refresh.classList.remove('spin');
    void refresh.offsetWidth;
    refresh.classList.add('spin');
  });

  // Hidden mode switch: tap Ratatouille's avatar 3 times quickly.
  let taps = 0, tapTimer = null;
  avatar.addEventListener('click', () => {
    taps++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => { taps = 0; }, 600);
    if (taps >= 3) {
      taps = 0;
      toggleMode();
    }
  });

  // Long-press a message to delete it.
  function attachLongPress(el, id) {
    let timer = null;
    const start = () => {
      el.classList.add('deleting');
      timer = setTimeout(() => {
        timer = null;
        if (confirm('למחוק את ההודעה?')) {
          state.messages = state.messages.filter(m => m.id !== id);
          save();
          render();
        } else {
          el.classList.remove('deleting');
        }
      }, 650);
    };
    const cancel = () => {
      if (timer) { clearTimeout(timer); timer = null; }
      el.classList.remove('deleting');
    };
    el.addEventListener('pointerdown', start);
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(e => el.addEventListener(e, cancel));
    el.addEventListener('contextmenu', e => e.preventDefault());
  }

  let typingTimer = null;
  function sendMessage() {
    const value = text.value.trim();
    if (!value) return;
    const from = state.asRemy ? 'remy' : 'me';
    text.value = '';
    autosize();
    text.focus();

    const push = () => {
      state.messages.push({ id: Date.now() + Math.random(), from, text: value, t: Date.now() });
      save();
      render();
    };

    if (from === 'remy') {
      // Make it look like Ratatouille is typing for a moment
      status.textContent = 'מקליד...';
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => {
        push();
        status.textContent = 'מחובר';
      }, Math.min(400 + value.length * 40, 2000));
    } else {
      push();
    }
  }

  function autosize() {
    text.style.height = 'auto';
    text.style.height = Math.min(text.scrollHeight, 120) + 'px';
  }

  send.addEventListener('click', sendMessage);
  text.addEventListener('input', autosize);
  text.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  applyMode();
  render();
})();
</script>
</body>
</html>
